<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

#bl{left:calc(12px + var(--sl));width:88px;height:124px}#br{left:calc(108px + var(--sl));width:88px;height:124px}
#bg{right:calc(12px + var(--sr));width:118px;height:150px}#bb{right:calc(140px + var(--sr));width:84px;height:100px}
#bn{right:calc(140px + var(--sr));bottom:calc(122px + var(--sb));width:84px;height:62px;border-radius:18px;font-size:14px}

#menu{padding:calc(10px + var(--st)) calc(12px + var(--sr)) calc(10px + var(--sb)) calc(12px + var(--sl));background:linear-gradient(0deg,rgba(5,7,10,.96) 0%,rgba(5,7,10,.86) 40%,rgba(5,7,10,0) 74%)}

.card em{position:absolute;right:12px;top:12px;font-style:normal;font-size:12px;color:var(--acc);letter-spacing:.1em}
.card.off::after{content:"НАЖМИ — ЗАГРУЗИТЬ";position:absolute;inset:0;border-radius:16px;background:rgba(7,9,12,.7);display:grid;place-items:center;font-size:14px;letter-spacing:.16em;color:var(--acc)}.card.bad::after{content:"НЕДОСТУПНО";position:absolute;inset:0;border-radius:16px;background:rgba(7,9,12,.8);display:grid;place-items:center;font-size:14px;letter-spacing:.2em;color:#ff6b5e}.card.ld::after{content:"ЗАГРУЗКА…";position:absolute;inset:0;border-radius:16px;background:rgba(7,9,12,.72);display:grid;place-items:center;font-size:14px;letter-spacing:.2em;color:var(--dim)}

#load{z-index:40;background:var(--bg);justify-content:center;align-items:center;text-align:center;display:flex}
#bar{width:min(300px,70vw);height:4px;border-radius:9px;background:#1b222c;margin:16px auto 0;overflow:hidden}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--hot));transition:width .25s}
@media (orientation:landscape){#menu{flex-direction:row;justify-content:flex-end;align-items:flex-end;background:linear-gradient(270deg,rgba(5,7,10,.96) 0%,rgba(5,7,10,.88) 38%,rgba(5,7,10,0) 62%)}#menu .sheet{width:min(52vw,520px);max-height:calc(100dvh - 80px - var(--st))}#menu header{left:calc(14px + var(--sl))}}
@media (max-height:430px){#spdbox{transform:translateX(-50%) scale(.8);transform-origin:bottom}#cd{font-size:90px}}
</style>
</head>

let lapsDone=0,lapTimes=[],lastLapT=0,lastLap=0,flashUntil=0,best=0,wrongT=0;

function lapEnd(){const t=raceT-lastLapT;lastLapT=raceT;lastLap=t;lapTimes.push(t);if(!best||t<best){best=t;try{localStorage.setItem(bestKey(),t)}catch(e){}}flashUntil=performance.now()+4000}
function ranks(){return [...cars].sort((a,b)=>(a.fin&&b.fin?a.fT-b.fT:a.fin?-1:b.fin?1:b.prog-a.prog))}
function hud(){
 const r=ranks(),p=r.indexOf(player)+1,lap=Math.min(LAPS,Math.max(1,Math.floor(Math.max(player.prog,0)/N)+1));
 $('pn').textContent=p;$('pt').textContent='/'+cars.length;$('pl').textContent='КРУГ '+lap+' ИЗ '+LAPS;
 $('tt').textContent=fmt(Math.max(raceT,0));$('lt').textContent=performance.now()<flashUntil?'КРУГ '+fmt(lastLap):best?'ЛУЧШИЙ '+fmt(best):'';
 const k=S.unit==='mph'?2.237:3.6,vmx=player.spec.vmax*TCF.vs,band=vmx/7,g=Math.min(7,Math.floor(player.speed/band)+1),w=(player.speed-(g-1)*band)/band;
 rpmF+=((player.speed<1?.12+ctl.gas*.2:.4+.6*Math.min(1,w))-rpmF)*.25;gauge(rpmF);
 $('spd').textContent=Math.round(player.speed*k);$('unit').textContent=S.unit==='mph'?'MPH':'КМ/Ч';$('gear').textContent=player.vf<-1?'R':player.speed<1?'N':g;
 $('nbar').firstChild.style.width=(player.nitro*100)+'%';
 const dr=$('drift');if(pDrift>20){dr.style.opacity=1;dr.innerHTML=Math.round(pDrift)+'<small>ДРИФТ ×'+combo+'</small>'}else dr.style.opacity=0;
 const c=MMC.bg?document.getElementById('mm').getContext('2d'):null;if(c){c.clearRect(0,0,160,104);c.drawImage(MMC.bg,0,0);cars.forEach(q=>{c.fillStyle=q===player?'#ffb020':'#5fd4ff';c.beginPath();c.arc(MMC.sx(q.x),MMC.sz(q.z),q===player?4.5:3.2,0,7);c.fill()})}
}
function hudShow(on){['pos','tm','mm','spdbox','nbar','pbtn','rbtn','cam','ctl'].forEach(i=>$(i).style.display=on?'':'none');['drift','lights','cd','wrong'].forEach(i=>{if(!on)$(i).style.display='none'});if(on){$('drift').style.display='';$('cd').style.display='';$('lights').style.display='none'}if(!on){$('fx').style.opacity=0}}

/* ---------- settings ---------- */
function applySettings(){
 const mx=R.capabilities.getMaxAnisotropy(),an=Math.min(S.an,mx);basePr=Math.min(devicePixelRatio||1,S.res);R.setPixelRatio(Math.max(.75,basePr*dynK));resize();
 PHYS.forEach(m=>{const v=S.cc?1:0;if(m.clearcoat!==v){m.clearcoat=v;m.needsUpdate=true}});
 const on=S.sh>0;sun.castShadow=on;if(on&&sun.shadow.mapSize.x!==S.sh){sun.shadow.mapSize.set(S.sh,S.sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
 scene.fog.density=.00042*S.fog*(TCF?TCF.fog:1);
 if(an!==ANISO){ANISO=an;ALLTEX.forEach(t=>{t.anisotropy=an;t.needsUpdate=true})}
 $('fps').style.display=S.fps?'block':'none';
}
function buildRows(){
 const box=$('rows');box.innerHTML='';
 OPTS.filter(o=>o[0]!=='hd'||Object.keys(HD).length).forEach(([k,lab,op])=>{const row=document.createElement('div');row.className='srow';const sp=document.createElement('span');sp.textContent=lab;const se=document.createElement('select');
  op.forEach(([v,t],i)=>{const o=document.createElement('option');o.value=i;o.textContent=t;se.appendChild(o)});
  let cur=op.findIndex(o=>o[0]===S[k]);if(cur<0)cur=0;se.value=cur;
  se.onchange=()=>{const v=op[+se.value][0];S[k]=v;if(k==='q'&&PRE[v])Object.assign(S,PRE[v]);else if(PK_.includes(k))S.q=Object.keys(PRE).find(p=>PK_.every(x=>PRE[p][x]===S[x]))||'custom';dynK=1;applySettings();saveS();hdChanged();buildRows();buildMenu()};
  row.append(sp,se);box.appendChild(row)});
}
const openSet=()=>{buildRows();$('set').classList.add('show')};
$('setbtn').onclick=openSet;$('pset').onclick=openSet;$('setok').onclick=()=>$('set').classList.remove('show');

/* ---------- garage UI ---------- */
function bestOf(tr,car){try{return +localStorage.getItem('mtr3_best_'+tr+'_'+car)||0}catch(e){return 0}}
function buildMenu(){
 const cr=$('cars');cr.innerHTML='';
 for(const k in CARS){const c=CARS[k],sp=c.spec,b=document.createElement('button');b.className='card'+(S.car===k?' sel':'')+(LOADED[k]?'':FAIL[k]?' bad':PROM[k]?' ld':' off');
  const bar=(l,v)=>'<div class="st"><span>'+l+'</span><i><b style="width:'+Math.round(Math.min(1,v)*100)+'%"></b></i></div>',bt=bestOf(S.track,k);
  b.innerHTML=(k==='gemera'?'<em>ГЛАВНАЯ</em>':'')+'<h3>'+c.n+'</h3><p>'+c.sub+'</p>'+bar('Скорость',sp.vmax/95)+bar('Разгон',sp.acc/21)+bar('Управл.',(sp.grip/6+sp.yaw/1.3)/2)+(bt?'<p style="margin:8px 0 0;color:var(--acc)">Лучший круг '+fmt(bt)+'</p>':'');
  b.onclick=()=>{if(FAIL[k]&&!PROM[k])FAIL[k]=0;S.car=k;saveS();buildMenu();need(k).then(()=>{buildMenu();if(S.car===k)showroom()}).catch(()=>buildMenu())};cr.appendChild(b)}
 const sw=$('sw');sw.innerHTML='';$('colsec').style.display=CARS[S.car].tint?'':'none';
 TINTS.forEach(([k,,hex])=>{const b=document.createElement('button');b.style.background=hex;b.className=S.tint===k?'sel':'';b.onclick=()=>{S.tint=k;saveS();buildMenu();showroom()};sw.appendChild(b)});
 const tr=$('tracks');tr.innerHTML='';
 for(const k in TRACKS){const t=TRACKS[k],b=document.createElement('button');b.className='card tcard'+(S.track===k?' sel':'')+(LOADED[k]?'':FAIL[k]?' bad':PROM[k]?' ld':' off');
  b.innerHTML='<canvas width="260" height="170"></canvas><h3>'+t.n+'</h3><p>'+t.sub+'</p>';if(MANS[k])drawMini(b.firstChild,MANS[k]);
  b.onclick=()=>{if(FAIL[k]&&!PROM[k])FAIL[k]=0;S.track=k;saveS();buildMenu();need(k).then(()=>{buildMenu();if(S.track===k)showroom()}).catch(()=>buildMenu())};tr.appendChild(b)}
 const lp=$('laps');lp.innerHTML='';[1,3,5].forEach(n=>{const b=document.createElement('button');b.className='chip'+(S.laps===n?' sel':'');b.textContent=n+(n===1?' круг':n<5?' круга':' кругов');b.onclick=()=>{S.laps=n;saveS();buildMenu()};lp.appendChild(b)});
 const ok=LOADED[S.car]&&LOADED[S.track];$('start').disabled=!ok;$('start').textContent=ok?'СТАРТ':'ЗАГРУЗКА…';
}
function clearCars(){cars.forEach(c=>scene.remove(c.m.root));if(showCar)scene.remove(showCar.m.root);cars=[];showCar=null;player=null}
function showroom(){
 if(!LOADED[S.car]||!LOADED[S.track])return;if(TRK!==S.track)useTrack(S.track);
 clearCars();trim();showCar=spawn(S.car,S.tint,0,false,1);showCar.x=CLX[START];showCar.z=CLZ[START];showCar.h=Math.atan2(-TX[START],-TZ[START]);place(showCar,1);state='menu';
}

/* ---------- race flow ---------- */
function newRace(){
 clearCars();if(TRK!==S.track)useTrack(S.track);trim();
 LAPS=S.laps;lapsDone=0;lapTimes=[];lastLapT=0;lastLap=0;flashUntil=0;wrongT=0;pDrift=0;dTime=0;dTot=0;combo=1;paused=false;best=bestOf(S.track,S.car);
 const pool=['gemera','porsche','ferrari'].filter(k=>LOADED[k]),tl=TINTS.map(t=>t[0]).filter(t=>t!==S.tint).sort(()=>Math.random()-.5);
 const defs=[[S.car,S.tint,false,1]];for(let i=0;i<S.bots;i++)defs.push([pool[(pool.indexOf(S.car)+1+i)%pool.length],tl[i],true,[.97,.95,.93][i]*S.diff]);
 const order=[2,0,3,1];defs.forEach((d,i)=>{const c=spawn(d[0],d[1],order[i],d[2],d[3]);cars.push(c);if(i===0)player=c});
 cars.forEach(c=>place(c,1));state='cd';cdT=5.3;raceT=0;$('end').classList.remove('show');hudShow(true);$('lights').style.display='';
}
function finishRace(){
 const p=ranks().indexOf(player)+1;state='end';$('ctl').style.display='none';
 $('eh').textContent=p===1?'Победа!':p+' место';
 $('et').innerHTML='Время '+fmt(raceT)+'<br>Круги: '+lapTimes.map(fmt).join(' · ')+'<br>Лучший круг: '+fmt(best)+(dTot+pDrift>0?'<br>Очки дрифта: '+Math.round(dTot+pDrift):'');
 $('end').classList.add('show');
}
let last=0,ema=16,lowT=0,upT=0,hudT=0,wrongOn=false,fxo=-1;
function frame(ts){
 requestAnimationFrame(frame);const dt=Math.min((ts-last)/1000||.016,.05);last=ts;
 ema+=(dt*1000-ema)*.05;if(S.fps)$('fps').textContent=Math.round(1000/ema)+' FPS · ×'+(basePr*dynK).toFixed(2);
 if(S.dyn&&state!=='menu'&&!paused){if(ema>25){if(++lowT>45&&basePr*dynK>.8){dynK*=.9;R.setPixelRatio(Math.max(.75,basePr*dynK));resize();lowT=0;ema=16}}else{lowT=0;if(ema<15&&dynK<1&&++upT>600){dynK=Math.min(1,dynK*1.08);R.setPixelRatio(Math.max(.75,basePr*dynK));resize();upT=0}}}
 if(paused&&state!=='menu'){R.render(scene,cam);return}
 if(state==='menu'||!player){
  const c=showCar;if(c){orbit+=dt*.3;const r=6.6;cam.position.set(c.x+Math.sin(orbit)*r,c.y+1.5,c.z+Math.cos(orbit)*r);cam.lookAt(c.x,c.y+(innerWidth>innerHeight?.1:-.7),c.z);cam.fov=42;
   if(innerWidth>innerHeight)cam.setViewOffset(innerWidth,innerHeight,innerWidth*.2,0,innerWidth,innerHeight);else cam.clearViewOffset();cam.updateProjectionMatrix();
   sun.position.set(c.x+SUN.x*120,SUN.y*120+c.y,c.z+SUN.z*120);sun.target.position.set(c.x,c.y,c.z);sun.target.updateMatrixWorld();sky.position.copy(cam.position)}
  R.render(scene,cam);return}
 cam.clearViewOffset();
 if(state==='cd'){cdT-=dt;const lit=Math.max(0,Math.min(5,5-Math.ceil(cdT-.3)));[...$('lights').children].forEach((e,i)=>e.classList.toggle('on',i<lit));if(cdT<=0){state='race';$('cd').textContent='GO!';$('lights').style.display='none'}}
 else{raceT+=dt;if(raceT>1)$('cd').textContent=''}
 const go=state==='race'||state==='end',inp={steer:Math.max(-1,Math.min(1,(ctl.l-ctl.r)*S.sens)),gas:go?(ctl.gas||S.auto?1:0):0,brake:go?ctl.brake:0,n:go?ctl.n:0};
 for(let s=0;s<2;s++){const h=dt/2;cars.forEach(c=>{if(go)step(c,h,c===player?inp:{})});
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j],dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz);if(d<2.5&&d>1e-3){const nx=dx/d,nz=dz/d,p=(2.5-d)/2;a.x-=nx*p;a.z-=nz*p;b.x+=nx*p;b.z+=nz*p;const rv=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;if(rv<0){const j2=rv*.5;a.vx+=nx*j2;a.vz+=nz*j2;b.vx-=nx*j2;b.vz-=nz*j2;if(a===player||b===player){shake=Math.min(1,shake-rv/25);buzz()}}}}}
 cars.forEach(c=>{place(c,dt);const dd=Math.hypot(c.x-player.x,c.z-player.z);castOn(c,c===player||dd<70);
  if(c===player&&!c.fin){const ld=Math.floor(Math.max(c.prog,0)/N);if(ld>lapsDone){lapsDone=ld;lapEnd()}}
  if(!c.fin&&c.prog>=LAPS*N){c.fin=true;c.fT=raceT;if(c===player)finishRace()}});
 // дрифт-очки
 {const ang=Math.abs(Math.atan2(player.vl,Math.max(player.vf,.1)))*57.3;if(go&&state==='race'&&player.speed>14&&ang>13&&ang<100&&!player.off_){dTime+=dt;combo=1+Math.floor(dTime/2);pDrift+=player.speed*ang*.018*combo*dt}else if(pDrift>0&&(ang<8||player.speed<10)){dTot+=pDrift;pDrift=0;dTime=0;combo=1}}
 smokeStep(dt);
 // камера
 const p=player,fx=-Math.sin(p.h),fz=-Math.cos(p.h),sp=p.speed;
 const cfg=[[7.6,2.7,6],[5.2,1.55,9],[-.55,1.12,14]][camMode],tx=p.x-fx*cfg[0],tz=p.z-fz*cfg[0],ty=p.y+cfg[1];
 const k=1-Math.exp(-dt*(camMode===2?30:6.5));cam.position.x+=(tx-cam.position.x)*k;cam.position.y+=(ty-cam.position.y)*k;cam.position.z+=(tz-cam.position.z)*k;
 shake*=Math.exp(-dt*5);cam.position.x+=(Math.random()-.5)*shake*.35;cam.position.y+=(Math.random()-.5)*shake*.25;
 cam.lookAt(p.x+fx*cfg[2],p.y+(camMode===2?1.0:1.1),p.z+fz*cfg[2]);
 const fv=64+sp*.15+(camMode===2?6:0)+(p.boost?9:0);if(Math.abs(cam.fov-fv)>.05){cam.fov+=(fv-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix()}
 p.m.root.visible=camMode!==2;
 sun.position.set(p.x+SUN.x*120,SUN.y*120+p.y,p.z+SUN.z*120);sun.target.position.set(p.x,p.y,p.z);sun.target.updateMatrixWorld();sky.position.copy(cam.position);
 {const i=p.idx,dot=p.vx*TX[i]+p.vz*TZ[i];wrongT=(go&&sp>8&&dot<-.3*sp)?wrongT+dt:0;const sw=wrongT>1.2;if(sw!==wrongOn){wrongOn=sw;$('wrong').style.display=sw?'block':'none'}}
 {const fo=Math.round(Math.max(0,Math.min(.85,(sp-50)/55+(p.boost?.25:0)))*20)/20;if(fo!==fxo){fxo=fo;$('fx').style.opacity=fo}}
 hudT+=dt;if(hudT>.066){hudT=0;hud()}sound();R.render(scene,cam);
}
function pauseOn(){if(state==='menu'||!player||paused)return;paused=true;$('pause').classList.add('show')}
$('pbtn').onclick=pauseOn;$('resume').onclick=()=>{paused=false;$('pause').classList.remove('show')};
$('prest').onclick=()=>{$('pause').classList.remove('show');newRace()};
function toGarage(){$('pause').classList.remove('show');$('end').classList.remove('show');paused=false;hudShow(false);$('cd').textContent='';$('lights').style.display='none';showroom();buildMenu();$('menu').classList.add('show')}
$('pmenu').onclick=toGarage;$('egar').onclick=toGarage;
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseOn()});
$('rbtn').onclick=()=>{if(!player||state==='menu')return;const i=player.idx;player.x=CLX[i];player.z=CLZ[i];player.h=Math.atan2(-TX[i],-TZ[i]);player.vx=player.vz=0;player.steer=0};
$('start').onclick=()=>{audio();$('menu').classList.remove('show');newRace()};
$('again').onclick=()=>newRace();
(async()=>{
 applySettings();const bar=document.querySelector('#bar i');
 try{
  const first=[S.track,S.car];let n=0;await Promise.all(first.map(k=>need(k).then(()=>{bar.style.width=(++n/2*100)+'%'})));
  hudShow(false);useTrack(S.track);showroom();buildMenu();$('load').classList.remove('show');$('load').style.display='none';requestAnimationFrame(frame);
 }catch(e){document.querySelector('#load div div:nth-child(2)').textContent='Ошибка загрузки: '+e.message;console.error(e)}
})();
</script>
